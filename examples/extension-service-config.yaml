apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nft-rules
configFiles:
  - mountPath: /etc/nft-rules/rules.nft
    content: |
      table inet talos_nftables_demo {}
      flush table inet talos_nftables_demo
      table inet talos_nftables_demo {
        chain prerouting {
          type filter hook prerouting priority raw; policy accept;
          meta l4proto tcp ip hdrlength > 5 counter drop
        }
      }
